<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小吴乐意 - 生酮实证与身体变化记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(229, 231, 235, 0.5);
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen pb-12">

    <div class="bg-emerald-600 pb-20 pt-12 px-6 shadow-inner">
        <div class="max-w-4xl mx-auto flex items-center gap-4 text-white">
            <div class="w-16 h-16 rounded-full bg-emerald-500 flex items-center justify-center text-3xl border-2 border-white shadow-md">
                🧑🏻‍💻
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-wide">小吴乐意</h1>
                <p class="text-emerald-100 text-sm mt-1">公开的生酮饮食与身体重塑记录</p>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-6 -mt-10">
        
        <div class="glass-card p-6 mb-8">
            <h2 class="text-lg font-semibold mb-2 text-gray-800">体重与体脂宏观趋势</h2>
            <div id="trendChart" style="width: 100%; height: 320px;"></div>
        </div>

        <div class="mb-4">
            <h2 class="text-xl font-bold text-gray-800 mb-6">变化日志 & 医疗记录</h2>
            <div id="timeline-container" class="relative border-l-2 border-emerald-200 ml-4 space-y-8 pb-4">
                </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 你的完整数据库（已加入 12 月到 1 月的数据）
        // ==========================================
        const journalData = [
            {
                date: '2025-12-18',
                type: 'milestone', 
                badge: '🏁 记录起点',
                weight: 165.5,
                fat: 28.3,
                diary: '这是有记录以来的初始状态，体重 165.5 斤，体脂率 28.3%。决定开始改变，记录下这个起点作为未来的对比。'
            },
            {
                date: '2025-12-30',
                type: 'daily',
                badge: '📉 明显下降',
                weight: 160.0,
                fat: 27.4,
                diary: '不到两周时间降到了 160 斤，掉了 5 斤半！初期掉秤很明显，体脂也下降了接近 1%。'
            },
            {
                date: '2026-01-01',
                type: 'milestone',
                badge: '🎆 新年里程碑',
                weight: 159.6,
                fat: 27.2,
                diary: '新年第一天，体重正式跌破 160 斤大关！是一个非常好的新年礼物。继续保持。'
            },
            {
                date: '2026-01-04',
                type: 'daily',
                badge: '📝 日常打卡',
                weight: 158.1,
                fat: 27.1,
                diary: '稳步下降中。虽然体脂率变化不大，但体重又降了 1.5 斤。'
            },
            {
                date: '2026-01-06',
                type: 'daily',
                badge: '⚠️ 波动记录',
                weight: 159.0,
                fat: 27.1,
                diary: '体重稍微反弹了 0.9 斤。很正常的生理波动，不用焦虑，坚持现在的饮食结构就好。'
            },
            {
                date: '2026-01-07',
                type: 'daily',
                badge: '📝 日常打卡',
                weight: 158.0,
                fat: 26.8,
                diary: '果然，昨天的反弹只是暂时的，今天又降回来了，而且体脂率跌破 27% 了！'
            },
            {
                date: '2026-01-10',
                type: 'daily',
                badge: '📝 日常打卡',
                weight: 156.6,
                fat: 26.6,
                diary: '继续平稳下降，156.6 斤。身体似乎已经开始适应减脂的状态了。'
            },
            {
                date: '2026-01-17',
                type: 'daily',
                badge: '📝 日常打卡',
                weight: 155.9,
                fat: 26.3,
                diary: '一周时间降了 0.7 斤，虽然速度放缓，但是体脂率在持续稳定下降，这是减纯脂肪的好现象。'
            },
            {
                date: '2026-01-21',
                type: 'daily',
                badge: '📝 日常打卡',
                weight: 154.6,
                fat: 26.2,
                diary: '体重 154.6 斤。相比一个月前（165.5斤），整整轻了将近 11 斤，整个人感觉轻快了很多。'
            },
            {
                date: '2026-01-25',
                type: 'daily',
                badge: '📝 日常打卡',
                weight: 155.3,
                fat: 26.1,
                diary: '体重微调反弹了 0.7 斤，但是体脂率依然在降（26.1%）。所以不要只看体重，体脂才是核心。'
            },
            {
                date: '2026-02-12',
                type: 'milestone',
                badge: '🎉 阶段突破',
                weight: 148.6,
                fat: 24.4,
                diary: '太惊喜了！经过一段时间，体重直接跌破 150 大关来到了 148.6 斤！体脂率降至 24.4%。生酮的威力彻底显现出来了。'
            },
            {
                date: '2026-02-18',
                type: 'daily',
                badge: '📝 日常打卡',
                weight: 149.4,
                fat: 24.5,
                diary: '轻微波动，体重 149.4 斤。'
            },
            {
                date: '2026-02-20',
                type: 'daily',
                badge: '📝 日常打卡',
                weight: 148.6,
                fat: 24.4,
                diary: '目前算下来从最高点已经减了快 17 斤了。稳住当前的饮食节奏。'
            },
            {
                date: '2026-02-26',
                type: 'medical',
                badge: '🏥 血液/尿液筛查',
                weight: 148.0,
                fat: 24.2,
                diary: '今天进行了一次全面的化验。其中空腹胰岛素控制得非常漂亮（9.70 mU/L），处于绝对正常的范围内，说明没有严重的胰岛素抵抗。结合尿酮弱阳性，身体正在高效利用脂肪。部分血常规指标略有异常（血钠偏低），可能和生酮利尿流失电解质有关，后续要注意补充海盐。',
                medicalData: [
                    {
                        category: '🟢 生酮核心代谢',
                        items: [
                            { name: '空腹胰岛素', value: '9.70', unit: 'mU/L', normal: true, note: '绝佳状态' },
                            { name: '葡萄糖', value: '4.960', unit: 'mmol/L', normal: true },
                            { name: '尿酮体', value: '+-', unit: '', normal: true, note: '弱阳' },
                            { name: '甘油三酯', value: '0.600', unit: 'mmol/L', normal: true }
                        ]
                    },
                    {
                        category: '🔴 异常指标提醒',
                        items: [
                            { name: '钠 (Na)', value: '136.70', unit: 'mmol/L', normal: false, status: '↓ 偏低' }
                        ]
                    }
                ]
            }
        ];

        // 渲染时间轴
        const timelineContainer = document.getElementById('timeline-container');
        
        [...journalData].reverse().forEach(item => {
            let badgeColor = 'bg-gray-100 text-gray-700';
            if(item.type === 'milestone') badgeColor = 'bg-yellow-100 text-yellow-700';
            if(item.type === 'medical') badgeColor = 'bg-blue-100 text-blue-700';
            if(item.type === 'daily') badgeColor = 'bg-emerald-50 text-emerald-600';

            // 构建基础指标栏 (体重/体脂)
            let basicStatsHtml = '';
            if (item.weight && item.fat) {
                basicStatsHtml = `
                    <div class="flex gap-4 text-sm text-gray-600 mb-4 bg-gray-50 p-3 rounded-lg border border-gray-100">
                        <div class="flex items-center gap-1"><span class="text-gray-400">⚖️ 体重:</span> <span class="font-semibold">${item.weight} 斤</span></div>
                        <div class="flex items-center gap-1"><span class="text-gray-400">📉 体脂:</span> <span class="font-semibold">${item.fat}%</span></div>
                    </div>
                `;
            }

            // 构建灵活的医疗数据 HTML
            let medicalHtml = '';
            if (item.medicalData) {
                item.medicalData.forEach(group => {
                    let itemsHtml = group.items.map(m => {
                        const valColor = m.normal ? 'text-gray-800' : 'text-red-500 font-bold';
                        const extraNote = m.status ? `<span class="text-xs text-red-500 ml-1">${m.status}</span>` : (m.note ? `<span class="text-xs text-gray-500 ml-1">(${m.note})</span>` : '');
                        return `
                            <div class="flex justify-between items-center py-1.5 border-b border-gray-50 last:border-0">
                                <span class="text-sm text-gray-600">${m.name}</span>
                                <div>
                                    <span class="text-sm ${valColor}">${m.value} <span class="text-xs text-gray-400">${m.unit}</span></span>
                                    ${extraNote}
                                </div>
                            </div>
                        `;
                    }).join('');
                    
                    medicalHtml += `
                        <div class="mt-4 bg-white border border-gray-100 rounded-lg p-4 shadow-sm">
                            <h4 class="text-sm font-semibold text-gray-700 mb-2 border-l-2 border-emerald-400 pl-2">${group.category}</h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6">
                                ${itemsHtml}
                            </div>
                        </div>
                    `;
                });
            }

            const card = `
                <div class="relative pl-6">
                    <div class="absolute w-4 h-4 bg-emerald-400 rounded-full -left-[9px] top-1.5 border-4 border-white shadow"></div>
                    <div class="glass-card p-5 hover:shadow-md transition-shadow">
                        <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
                            <h3 class="font-bold text-gray-800 text-lg">${item.date}</h3>
                            <span class="${badgeColor} text-xs px-2.5 py-1 rounded-full font-medium">${item.badge}</span>
                        </div>
                        ${basicStatsHtml}
                        <div class="text-gray-700 text-sm leading-relaxed whitespace-pre-line border-l-2 border-emerald-100 pl-3">
                            ${item.diary}
                        </div>
                        ${medicalHtml}
                    </div>
                </div>
            `;
            timelineContainer.innerHTML += card;
        });

        // 渲染 ECharts 
        const chartDom = document.getElementById('trendChart');
        const myChart = echarts.init(chartDom);
        const chartData = journalData.filter(item => item.weight && item.fat);
        const option = {
            tooltip: { trigger: 'axis' },
            legend: { data: ['体重 (斤)', '体脂率 (%)'], bottom: 0 },
            grid: { left: '3%', right: '4%', bottom: '15%', top: '10%', containLabel: true },
            xAxis: { 
                type: 'category', 
                boundaryGap: false, 
                data: chartData.map(item => item.date.substring(5)), // 只显示月-日，让横轴更清爽
                axisLine: { lineStyle: { color: '#e5e7eb' } }, 
                axisLabel: { color: '#6b7280' } 
            },
            yAxis: [
                { type: 'value', min: 'dataMin', name: '体重', axisLine: { show: false }, splitLine: { lineStyle: { type: 'dashed', color: '#f3f4f6' } } },
                { type: 'value', min: 'dataMin', name: '体脂率', position: 'right', axisLine: { show: false }, splitLine: { show: false } }
            ],
            series: [
                { name: '体重 (斤)', type: 'line', smooth: true, itemStyle: { color: '#10b981' }, data: chartData.map(item => item.weight) },
                { name: '体脂率 (%)', type: 'line', smooth: true, yAxisIndex: 1, itemStyle: { color: '#f59e0b' }, data: chartData.map(item => item.fat) }
            ]
        };
        myChart.setOption(option);
        window.addEventListener('resize', () => myChart.resize());
    </script>
</body>
</html>
